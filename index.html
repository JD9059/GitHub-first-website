<!DOCTYPE html>
<html>

<head>
    <title>Captain Clue V2</title>

    <style>
        body {
            margin: 0;
            font-family: Calibri, sans-serif;
            background: #87CEEB;
            text-align: center;
            font-weight: bold;
            font-size: 14px;
        }

        #lang {
            position: fixed;
            top: 8px;
            left: 8px;
            padding: 6px;
            font-size: 12px;
            border-radius: 8px;
            z-index: 9999;
        }

        #feedbackBtn {
            position: fixed;
            top: 8px;
            right: 8px;
            padding: 6px 10px;
            font-size: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: white;
            z-index: 9999;
        }

        #contactBtn {
            position: fixed;
            top: 8px;
            right: 105px;
            padding: 6px 10px;
            font-size: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: white;
            z-index: 9999;
            text-decoration: none;
            color: black;
            display: inline-block;
        }

        .pirate-img {
            width: 100px;
            margin-top: 10px;
            animation: floatPirate 3s ease-in-out infinite;
        }

        @keyframes floatPirate {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-8px);
            }
        }

        #homePage,
        #gamePage,
        #guessPage,
        #continuePage,
        #winnerPage {
            display: none;
            min-height: 100vh;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        #homePage {
            display: flex;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 850px;
            width: 90%;
        }

        .flag {
            font-size: 50px;
        }

        h1 {
            font-size: 28px;
            margin: 8px;
        }

        h2 {
            font-size: 22px;
            margin: 8px;
        }

        p {
            margin: 8px;
        }

        #question,
        #guessText {
            font-size: 22px;
            margin: 12px;
        }

        button {
            padding: 7px 10px;
            margin: 3px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
        }

        .yesBtn {
            background: limegreen;
            color: white;
        }

        .noBtn {
            background: red;
            color: white;
        }

        .dkBtn {
            background: gray;
            color: white;
        }

        .probBtn {
            background: gold;
        }

        .probNotBtn {
            background: orange;
        }

        .utilityBtn {
            background: white;
        }

        input {
            padding: 8px;
            font-size: 14px;
        }

        #feedbackBox {
            display: none;
            position: fixed;
            top: 50px;
            right: 8px;
            background: white;
            padding: 8px;
            border-radius: 10px;
            z-index: 9999;
            width: 220px;
        }

        #feedbackText {
            width: 195px;
            height: 70px;
        }

        #feedbackThanks {
            font-size: 12px;
        }
    </style>
</head>

<body>

    <select id="lang" onchange="setLang()">
        <option value="en">English</option>
        <option value="es">Español</option>
        <option value="fr">Français</option>
        <option value="de">Deutsch</option>
        <option value="it">Italiano</option>
        <option value="pt">Português</option>
        <option value="ja">日本語</option>
        <option value="ko">한국어</option>
    </select>

    <button id="feedbackBtn" onclick="openFeedback()">💬 Feedback</button>

    <a id="contactBtn" href="sms:jackbug412@icloud.com">📩 Contact Me</a>

    <div id="feedbackBox">
        <h3 id="feedbackTitle">Feedback</h3>
        <textarea id="feedbackText" placeholder="Type real feedback..."></textarea>
        <br>
        <button id="feedbackSubmitBtn" onclick="submitFeedback()">Submit</button>
        <button id="feedbackCloseBtn" onclick="closeFeedback()">Close</button>
        <p id="feedbackThanks"></p>
    </div>

    <div id="homePage">
        <div class="container">

            <div class="flag">🏴‍☠️</div>

            <h1 id="titleText">Captain Clue</h1>

            <img src="pirate.png" class="pirate-img" alt="Captain Clue Pirate">

            <p id="introText">Think of a YouTuber and I will guess it!</p>

            <button id="startBtn" onclick="startGame()">Start Game</button>

        </div>
    </div>

    <div id="gamePage">
        <div class="container">

            <img src="pirate.png" class="pirate-img" alt="Captain Clue Pirate">

            <div id="question">Loading...</div>

            <div id="answerButtons">
                <button id="yesBtn" class="yesBtn" onclick="answer('yes')">Yes</button>
                <button id="noBtn" class="noBtn" onclick="answer('no')">No</button>
                <button id="dkBtn" class="dkBtn" onclick="answer('dk')">Don't Know</button>
                <button id="probBtn" class="probBtn" onclick="answer('probably')">Probably</button>
                <button id="probNotBtn" class="probNotBtn" onclick="answer('probablynot')">Probably Not</button>
            </div>

            <div id="utilityButtons">
                <button id="backBtn" class="utilityBtn" onclick="goBack()">⬅️ Go Back</button>
                <button id="skipBtn" class="utilityBtn" onclick="skipQuestion()">⏭️ Skip</button>
                <button id="restartBtn" class="utilityBtn" onclick="restartGame()">🔄 Restart</button>
            </div>

        </div>
    </div>

    <div id="guessPage">
        <div class="container">

            <div id="guessText">Guessing...</div>

            <div>
                <button id="guessYesBtn" class="yesBtn" onclick="handleGuessResult(true)">Yes</button>
                <button id="guessNoBtn" class="noBtn" onclick="handleGuessResult(false)">No</button>
            </div>

        </div>
    </div>

    <div id="continuePage">
        <div class="container">

            <img src="pirate.png" class="pirate-img" alt="Captain Clue Pirate">

            <h2 id="continueText">Continue?</h2>

            <button id="continueYesBtn" class="yesBtn" onclick="continueGame()">Yes</button>
            <button id="continueNoBtn" class="noBtn" onclick="showWinnerPage()">No</button>

        </div>
    </div>

    <div id="winnerPage">
        <div class="container">

            <img src="pirate.png" class="pirate-img" alt="Captain Clue Pirate">

            <h2 id="winnerTitle">🏆 You Win!</h2>

            <p id="winnerPrompt">Who were you thinking of?</p>

            <input id="newYoutuber" placeholder="Type YouTuber name">
            <br><br>

            <button id="saveBtn" onclick="saveNewYoutuber()">Save</button>

        </div>
    </div>

/* 🎮 GAME FUNCTIONS */
function getQuestions() {
    return questionsByLang[currentLang] || questionsByLang.en;
}

function getQuestionText() {
    let translated = getQuestions();
    return translated[currentQuestion] || questionsByLang.en[currentQuestion];
}

function showPage(pageId) {
    document.getElementById("homePage").style.display = "none";
    document.getElementById("gamePage").style.display = "none";
    document.getElementById("guessPage").style.display = "none";
    document.getElementById("continuePage").style.display = "none";
    document.getElementById("winnerPage").style.display = "none";

    document.getElementById(pageId).style.display = "flex";
    currentPage = pageId;
}

function startGame() {
    currentQuestion = 0;
    confidence = 0;
    guessedAlready = [];

    showPage("gamePage");
    document.getElementById("question").textContent = getQuestionText();
}

function answer(type) {
    if (type === "yes") confidence += 20;
    if (type === "probably") confidence += 15;
    if (type === "probablynot") confidence += 8;
    if (type === "dk") confidence += 3;
    if (type === "no") confidence -= 5;

    if (confidence < 0) confidence = 0;

    nextQuestion();
}

function nextQuestion() {
    currentQuestion++;

    if (confidence >= 250 || currentQuestion >= questionsByLang.en.length) {
        makeGuess();
        return;
    }

    document.getElementById("question").textContent = getQuestionText();
}

function makeGuess() {
    let available = youtubers.filter(name => !guessedAlready.includes(name));

    if (available.length === 0) {
        showWinnerPage();
        return;
    }

    currentGuess = available[Math.floor(Math.random() * available.length)];
    guessedAlready.push(currentGuess);

    document.getElementById("guessText").innerHTML =
        uiText[currentLang].guessStart + "<b>" + currentGuess + "</b>?";

    showPage("guessPage");
}

function handleGuessResult(isCorrect) {
    if (isCorrect) {
        alert(uiText[currentLang].captainWins);
        restartGame();
    } else {
        showPage("continuePage");
    }
}

function continueGame() {
    if (currentQuestion >= questionsByLang.en.length) {
        makeGuess();
        return;
    }

    showPage("gamePage");
    document.getElementById("question").textContent = getQuestionText();
}

function showWinnerPage() {
    showPage("winnerPage");
}

function goBack() {
    if (currentQuestion > 0) {
        currentQuestion--;
        document.getElementById("question").textContent = getQuestionText();
    }
}

function skipQuestion() {
    nextQuestion();
}

function restartGame() {
    location.reload();
}

function saveNewYoutuber() {
    let name = document.getElementById("newYoutuber").value.trim();

    if (name !== "") {
        youtubers.push(name);
        alert(uiText[currentLang].savedStart + name);
        restartGame();
    }
}

function setLang() {
    currentLang = document.getElementById("lang").value;
    updateLanguage();
}

    let t = uiText[currentLang];

    document.getElementById("titleText").textContent = "🏴‍☠️ " + t.title;

    document.getElementById("feedbackText").placeholder = t.feedbackPlaceholder;
    document.getElementById("feedbackSubmitBtn").textContent = t.feedbackSubmit;
    document.getElementById("feedbackCloseBtn").textContent = t.feedbackClose;

    document.getElementById("yesBtn").textContent = t.yes;
    document.getElementById("noBtn").textContent = t.no;
    document.getElementById("dkBtn").textContent = t.dk;
    document.getElementById("probBtn").textContent = t.probably;
    document.getElementById("probNotBtn").textContent = t.probablyNot;

    document.getElementById("backBtn").textContent = t.back;
    document.getElementById("skipBtn").textContent = t.skip;
    document.getElementById("restartBtn").textContent = t.restart;

    document.getElementById("guessYesBtn").textContent = t.yes;
    document.getElementById("guessNoBtn").textContent = t.no;

    document.getElementById("continueText").textContent = t.continueText;
    document.getElementById("continueYesBtn").textContent = t.yes;
    document.getElementById("continueNoBtn").textContent = t.no;

    document.getElementById("winnerTitle").textContent = t.winnerTitle;
    document.getElementById("winnerPrompt").textContent = t.winnerPrompt;
    document.getElementById("saveBtn").textContent = t.save;

    if (currentPage === "gamePage") {
        document.getElementById("question").textContent = getQuestionText();
    }

    if (currentPage === "guessPage" && currentGuess !== "") {
        document.getElementById("guessText").innerHTML =
            t.guessStart + "<b>" + currentGuess + "</b>?";
    }
}
