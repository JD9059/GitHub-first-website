<!DOCTYPE html>
<html>

<head>
<title>Captain Clue</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #87CEEB;
    text-align: center;
}

/* TOP UI */
#lang, #feedbackBtn, #contactBtn {
    position: fixed;
    top: 10px;
    background: white;
    padding: 8px 10px;
    border-radius: 10px;
    cursor: pointer;
    z-index: 9999;
}

#lang { left: 10px; }
#feedbackBtn { right: 10px; }
#contactBtn { right: 120px; }

/* LAYOUT */
.container {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
}

/* BUTTONS */
button {
    padding: 10px 15px;
    margin: 5px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
}

.yes { background: limegreen; color: white; }
.no { background: red; color: white; }
.dk { background: gray; color: white; }
.prob { background: gold; }
.probnot { background: orange; }

/* IMAGE */
img {
    width: 160px;
    border-radius: 10px;
}

/* POPUP */
#popup {
    display: none;
    position: fixed;
    top: 80px;
    right: 10px;
    background: white;
    padding: 10px;
    border-radius: 10px;
    z-index: 9999;
    width: 220px;
}
</style>

</head>

<body>

<!-- 🌍 LANGUAGE -->
<select id="lang" onchange="setLang()">
<option value="en">English</option>
<option value="es">Español</option>
<option value="fr">Français</option>
<option value="de">Deutsch</option>
<option value="it">Italiano</option>
<option value="pt">Português</option>
<option value="ru">Русский</option>
<option value="ar">العربية</option>
<option value="zh">中文</option>
<option value="ja">日本語</option>
<option value="ko">한국어</option>
</select>

<!-- 💬 FEEDBACK -->
<div id="feedbackBtn" onclick="openPopup('feedback')">Feedback</div>

<!-- 📩 CONTACT -->
<div id="contactBtn" onclick="openPopup('contact')">Contact Me</div>

<!-- POPUP BOX -->
<div id="popup">
    <h3 id="popupTitle"></h3>
    <textarea id="popupText" style="width:100%;height:80px;"></textarea>
    <br>
    <button onclick="sendPopup()">Send</button>
</div>

<!-- HOME -->
<div id="home" class="container">
    <h1 id="title">🏴‍☠️ Captain Clue</h1>
    <img src="https://i.imgur.com/2yaf2wb.png">
    <button onclick="start()">Start Game</button>
</div>

<!-- GAME -->
<div id="game" class="container" style="display:none">

    <h2 id="question"></h2>

    <div>
        <button class="yes" onclick="answer(true)">Yes</button>
        <button class="no" onclick="answer(false)">No</button>
        <button class="dk" onclick="answer(null)">Don't Know</button>
        <button class="prob" onclick="answer(true)">Probably</button>
        <button class="probnot" onclick="answer(false)">Probably Not</button>
    </div>

</div>

<!-- GUESS -->
<div id="guess" class="container" style="display:none">

    <h2 id="guessText"></h2>
    <img id="guessImg">

    <button class="yes" onclick="correct()">Yes</button>
    <button class="no" onclick="wrong()">No</button>

</div>

<!-- CONTINUE -->
<div id="continue" class="container" style="display:none">

    <h2>Continue?</h2>
    <button class="yes" onclick="back()">Yes</button>
    <button class="no" onclick="teach()">No</button>

</div>

<script>

/* 🌍 LANGUAGE */
let lang = "en";

const texts = {
en:"Captain Clue",
es:"Capitán Clue",
fr:"Capitaine Clue",
de:"Captain Clue",
it:"Capitano Clue",
pt:"Capitão Clue",
ru:"Капитан Клу",
ar:"كابتن كلو",
zh:"船长线索",
ja:"キャプテン・クルー",
ko:"캡틴 클루"
};

function setLang(){
    lang = document.getElementById("lang").value;
    document.getElementById("title").innerText = "🏴‍☠️ " + texts[lang];
}

/* 💬 POPUP SYSTEM */
let mode = "";

function openPopup(type){
    mode = type;
    document.getElementById("popup").style.display = "block";
    document.getElementById("popupTitle").innerText =
        type === "feedback" ? "Feedback" : "Contact Me";
}

function sendPopup(){
    let msg = document.getElementById("popupText").value;
    if(!msg) return;

    window.location.href =
    "mailto:jdiddens2195@gmail.com?subject=" +
    (mode === "feedback" ? "Captain Clue Feedback" : "Captain Clue Contact") +
    "&body=" + encodeURIComponent(msg);

    document.getElementById("popup").style.display = "none";
    document.getElementById("popupText").value = "";
}

/* 🎮 GAME */
let i = 0;
let score = 0;

let youtubers = [
{ name:"MrBeast", image:"https://i.imgur.com/9J6n3hR.png" },
{ name:"Markiplier", image:"https://i.imgur.com/7Qx0G2M.png" },
{ name:"DanTDM", image:"https://i.imgur.com/2R2Z8yQ.png" },
{ name:"MKBHD", image:"https://i.imgur.com/Wv7QKxA.png" }
];

let questions = [
"Is your YouTuber famous?",
"Do they play games?",
"Do they make challenges?",
"Do they have millions of subscribers?",
"Do they show their face?",
"Do they upload often?"
];

/* START */
function start(){
    i = 0;
    score = 0;

    document.getElementById("home").style.display="none";
    document.getElementById("game").style.display="flex";

    showQ();
}

function showQ(){
    document.getElementById("question").innerText = questions[i];
}

/* ANSWER */
function answer(val){
    if(val === true) score += 2;
    if(val === false) score -= 1;

    i++;

    if(i >= questions.length || score >= 10){
        guess();
        return;
    }

    showQ();
}

/* GUESS */
function guess(){
    let pick = youtubers[Math.floor(Math.random()*youtubers.length)];

    document.getElementById("game").style.display="none";
    document.getElementById("guess").style.display="flex";

    document.getElementById("guessText").innerText =
    "Are you thinking of " + pick.name + "?";

    document.getElementById("guessImg").src = pick.image;
}

/* RESULT */
function correct(){
    alert("Captain Clue wins!");
    location.reload();
}

function wrong(){
    document.getElementById("guess").style.display="none";
    document.getElementById("continue").style.display="flex";
}

function back(){
    document.getElementById("continue").style.display="none";
    document.getElementById("game").style.display="flex";
    showQ();
}

function teach(){
    location.reload();
}

</script>

</body>
</html>
