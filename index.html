            font-weight: bold;
            font-size: 14px;
        }

        #lang {
            position: fixed;
            top: 8px;
            left: 8px;
            padding: 6px;
            font-size: 12px;
            border-radius: 8px;
            z-index: 9999;
        }

        #feedbackBtn {
            position: fixed;
            top: 8px;
            right: 8px;
            padding: 6px 10px;
            font-size: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: white;
            z-index: 9999;
        }

        #contactBtn {
            position: fixed;
            top: 8px;
            right: 105px;
            padding: 6px 10px;
            font-size: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: white;
            z-index: 9999;
        }

        .pirate-img {
            width: 100px;
            margin-top: 10px;
            animation: floatPirate 3s ease-in-out infinite;
        }

        @keyframes floatPirate {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        #homePage,
        #gamePage,
        #guessPage,
        #continuePage,
        #winnerPage {
            display: none;
            min-height: 100vh;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        #homePage {
            display: flex;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 850px;
            width: 90%;
        }

        .flag {
            font-size: 50px;
        }

        h1 {
            font-size: 28px;
            margin: 8px;
        }

        h2 {
            font-size: 22px;
            margin: 8px;
        }

        p {
            margin: 8px;
        }

        #question,
        #guessText {
            font-size: 22px;
            margin: 12px;
        }

        button {
            padding: 7px 10px;
            margin: 3px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
        }

        .yesBtn { background: limegreen; color: white; }
        .noBtn { background: red; color: white; }
        .dkBtn { background: gray; color: white; }
        .probBtn { background: gold; }
        .probNotBtn { background: orange; }
        .utilityBtn { background: white; }

        input {
            padding: 8px;
            font-size: 14px;
        }

        #guessImg {
            width: 150px;
            border-radius: 12px;
            margin: 8px;
            background: white;
        }

        #feedbackBox {
            display: none;
            position: fixed;
            top: 50px;
            right: 8px;
            background: white;
            padding: 8px;
            border-radius: 10px;
            z-index: 9999;
            width: 220px;
        }

        #feedbackText {
            width: 195px;
            height: 70px;

    <select id="lang" onchange="setLang()">

    <button id="feedbackBtn" onclick="openFeedback()">💬 Feedback</button>
    <button id="contactBtn" onclick="openContact()">📩 Contact Me</button>

    <div id="feedbackBox">
        <h3 id="feedbackTitle">Feedback</h3>
        <textarea id="feedbackText" placeholder="Type your feedback..."></textarea>
        <br>
        <button onclick="submitFeedback()">Submit</button>
        <button onclick="closeFeedback()">Close</button>
        <p id="feedbackThanks"></p>
    </div>

    <div id="homePage">
        <div class="container">

            <div class="flag">🏴‍☠️</div>

            <h1 id="titleText">Captain Clue</h1>

            <img src="pirate.png" class="pirate-img" alt="Captain Clue Pirate">

            <p id="introText">Think of a YouTuber and I will guess it!</p>

            <button id="startBtn" onclick="startGame()">Start Game</button>

        </div>
    </div>

    <div id="gamePage">
        <div class="container">

            <img src="pirate.png" class="pirate-img" alt="Captain Clue Pirate">

            <div id="question">Loading...</div>

            <div id="answerButtons">
                <button id="yesBtn" class="yesBtn" onclick="answer('yes')">Yes</button>
                <button id="noBtn" class="noBtn" onclick="answer('no')">No</button>
                <button id="dkBtn" class="dkBtn" onclick="answer('dk')">Don't Know</button>
                <button id="probBtn" class="probBtn" onclick="answer('probably')">Probably</button>
                <button id="probNotBtn" class="probNotBtn" onclick="answer('probablynot')">Probably Not</button>
            </div>

            <div id="utilityButtons">
                <button id="backBtn" class="utilityBtn" onclick="goBack()">⬅️ Go Back</button>
                <button id="skipBtn" class="utilityBtn" onclick="skipQuestion()">⏭️ Skip</button>
                <button id="restartBtn" class="utilityBtn" onclick="restartGame()">🔄 Restart</button>
            </div>

        </div>
    </div>

    <div id="guessPage">
        <div class="container">

            <img src="pirate.png" class="pirate-img" alt="Captain Clue Pirate">

            <div id="guessText">Guessing...</div>

            <img id="guessImg" src="pirate.png" alt="YouTuber image">

            <div>
                <button id="guessYesBtn" class="yesBtn" onclick="handleGuessResult(true)">Yes</button>
                <button id="guessNoBtn" class="noBtn" onclick="handleGuessResult(false)">No</button>
            </div>

        </div>
    </div>

    <div id="continuePage">
        <div class="container">

            <img src="pirate.png" class="pirate-img" alt="Captain Clue Pirate">

            <h2 id="continueText">Continue?</h2>

            <button id="continueYesBtn" class="yesBtn" onclick="continueGame()">Yes</button>
            <button id="continueNoBtn" class="noBtn" onclick="showWinnerPage()">No</button>

        </div>
    </div>

    <div id="winnerPage">
        <div class="container">

            <img src="pirate.png" class="pirate-img" alt="Captain Clue Pirate">

            <h2 id="winnerTitle">🏆 You Win!</h2>

            <p id="winnerPrompt">Who were you thinking of?</p>

            <input id="newYoutuber" placeholder="Type YouTuber name">
            <br><br>

            <button id="saveBtn" onclick="saveNewYoutuber()">Save</button>

        </div>
    </div>

const CONTACT_ADDRESS = "PUT-YOUR-IMESSAGE-EMAIL-HERE";

/* 💬 FEEDBACK + 📩 CONTACT */
function openFeedback() {
    document.getElementById("feedbackBox").style.display = "block";
    document.getElementById("feedbackThanks").textContent = "";
}

function closeFeedback() {
    document.getElementById("feedbackBox").style.display = "none";
}

function submitFeedback() {
    let msg = document.getElementById("feedbackText").value.trim();

    if (msg === "") {
        alert("Please type feedback first.");
        return;
    }

    document.getElementById("feedbackThanks").textContent =
        "Thank you for your feedback!";

    document.getElementById("feedbackText").value = "";
}

function openContact() {
    let msg = prompt("Type your message to Captain Clue:");

    if (msg && msg.trim() !== "") {
        window.location.href =
            "sms:" + CONTACT_ADDRESS + "?&body=" + encodeURIComponent(msg);
    }
}

    document.getElementById("winnerPrompt").textContent = t.winnerPrompt;

}

/* 🎮 GAME FUNCTIONS */
function showPage(pageId) {
    document.getElementById("homePage").style.display = "none";
    document.getElementById("gamePage").style.display = "none";
    document.getElementById("guessPage").style.display = "none";
    document.getElementById("continuePage").style.display = "none";
    document.getElementById("winnerPage").style.display = "none";

    document.getElementById(pageId).style.display = "flex";
}

function startGame() {
    currentQuestion = 0;
    confidence = 0;
    guessedAlready = [];

    showPage("gamePage");
    document.getElementById("question").textContent = questions[currentQuestion];
}

function answer(type) {
    if (type === "yes") confidence += 20;
    if (type === "probably") confidence += 15;
    if (type === "probablynot") confidence += 8;
    if (type === "dk") confidence += 3;
    if (type === "no") confidence -= 5;

    if (confidence < 0) confidence = 0;

    nextQuestion();
}

function nextQuestion() {
    currentQuestion++;

    if (confidence >= 250 || currentQuestion >= questions.length) {
        makeGuess();
        return;
    }

    document.getElementById("question").textContent = questions[currentQuestion];
}

function setGuessImage(paths) {
    let img = document.getElementById("guessImg");
    let pathIndex = 0;

    if (!Array.isArray(paths)) {
        paths = [paths];
    }

    if (paths.length === 0) {
        paths = ["pirate.png"];
    }

    img.onerror = function () {
        pathIndex++;

        if (pathIndex < paths.length) {
            img.src = paths[pathIndex];
        } else {
            img.onerror = null;
            img.src = "pirate.png";
        }
    };

    img.src = paths[0];
}

function makeGuess() {
    let available = youtubers.filter(name => !guessedAlready.includes(name));

    if (available.length === 0) {
        showWinnerPage();
        return;
    }

    currentGuess = available[Math.floor(Math.random() * available.length)];
    guessedAlready.push(currentGuess);

    document.getElementById("guessText").innerHTML =
        uiText[currentLang].guessStart + "<b>" + currentGuess + "</b>?";

    let imagePaths = youtuberImages[currentGuess] || ["pirate.png"];

    setGuessImage(imagePaths);

    showPage("guessPage");
}

function handleGuessResult(isCorrect) {
    if (isCorrect) {
        alert("The Captain wins again! Huzzah! 🏴‍☠️");
        restartGame();
    } else {
        showPage("continuePage");
    }
}

function continueGame() {
    if (currentQuestion >= questions.length) {
        makeGuess();
        return;
    }

    showPage("gamePage");
    document.getElementById("question").textContent = questions[currentQuestion];
}

function showWinnerPage() {
    showPage("winnerPage");
}

function goBack() {
    if (currentQuestion > 0) {
        currentQuestion--;
        document.getElementById("question").textContent = questions[currentQuestion];
    }
}

function skipQuestion() {
    nextQuestion();
}

function restartGame() {
    location.reload();
}

function saveNewYoutuber() {
    let name = document.getElementById("newYoutuber").value.trim();

    if (name !== "") {
        youtubers.push(name);
        alert("Thank you for teaching Captain Clue a new YouTuber!\n\nSaved: " + name);
        restartGame();
    }
}

window.onload = function () {
    showPage("homePage");
    updateLanguage();
};
