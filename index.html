<!DOCTYPE html>
<html>
<head>
    <title>Captain Clue V2</title>

    <style>
        body {
            margin: 0;
            font-family: Calibri, sans-serif;
            background: #87CEEB;
            text-align: center;
        }

        #homePage,
        #gamePage,
        #winnerPage {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #gamePage,
        #winnerPage {
            display: none;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 900px;
            width: 90%;
            padding: 20px;
        }

        /* FLOAT ANIMATION */
        @keyframes floatPirate {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .flag {
            font-size: 90px;
            animation: floatPirate 3s ease-in-out infinite;
        }

        #question {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 25px;
            max-width: 900px;
        }

        .button {
            padding: 12px 24px;
            margin: 5px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 18px;
        }

        .yesBtn { background: limegreen; color: white; }
        .noBtn { background: red; color: white; }
        .dkBtn { background: gray; color: white; }
        .probBtn { background: gold; }
        .probNotBtn { background: orange; }

        .utilityBtn {
            background: white;
        }

        textarea {
            width: 300px;
            height: 100px;
            font-size: 16px;
            padding: 10px;
            margin-top: 15px;
        }

        .input {
            padding: 10px;
            font-size: 18px;
            width: 300px;
        }

        form {
            margin-top: 20px;
        }

        .pirate-img {
            width: 200px;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>

<!-- HOME PAGE -->
<div id="homePage">
    <div class="container">

        <div class="flag">🏴‍☠️</div>

        <h1>Captain Clue</h1>

        <p>Think of a YouTuber and I'll try to guess who it is!</p>

        <button onclick="startGame()">Start Game</button>

        <form action="https://formspree.io/f/xgobrrnl" method="POST">
            <textarea name="feedback" placeholder="Tell Captain Clue what you think!" required></textarea>
            <br><br>
            <button type="submit">Send Feedback</button>
        </form>

    </div>
</div>

<!-- GAME PAGE -->
<div id="gamePage">
    <div class="container">

        <img src="pirate.png" class="pirate-img" alt="Captain Clue Pirate">

        <div id="question"></div>

        <div id="answerButtons">
            <button class="yesBtn" onclick="answer('yes')">Yes</button>
            <button class="noBtn" onclick="answer('no')">No</button>
            <button class="dkBtn" onclick="answer('dk')">Don't Know</button>
            <button class="probBtn" onclick="answer('probably')">Probably</button>
            <button class="probNotBtn" onclick="answer('probablynot')">Probably Not</button>
        </div>

        <br>

        <div id="utilityButtons">
            <button class="utilityBtn" onclick="goBack()">⬅️ Go Back</button>
            <button class="utilityBtn" onclick="skipQuestion()">⏭️ Skip</button>
            <button class="utilityBtn" onclick="restartGame()">🔄 Restart</button>
        </div>

    </div>
</div>

<!-- WINNER PAGE -->
<div id="winnerPage">
    <div class="container">

        <h2>🏆 You Win!</h2>

        <p>Who were you thinking of?</p>

        <input id="newYoutuber" placeholder="Type YouTuber name">

        <br><br>

        <button onclick="saveNewYoutuber()">Save</button>

    </div>
</div>

<script>

let currentQuestion = 0;
let confidence = 0;
let skippedQuestions = [];

let youtubers = [
    "MrBeast", "DanTDM", "Preston", "Unspeakable", "Flamingo",
    "ThinkNoodles", "PewDiePie", "Markiplier", "Jacksepticeye",
    "Dream", "Technoblade", "Ludwig", "SSSniperWolf"
];

const questions = [
    "Does your YouTuber play Minecraft?",
    "Does your YouTuber play Roblox?",
    "Does your YouTuber show their face?",
    "Does your YouTuber have over 1 million subscribers?",
    "Is your YouTuber known for gaming?"
];

function startGame() {
    document.getElementById("homePage").style.display = "none";
    document.getElementById("gamePage").style.display = "flex";

    currentQuestion = 0;
    confidence = 0;
    skippedQuestions = [];

    document.getElementById("question").textContent =
        "Are you ready to play Captain Clue?";
}

function answer(type) {
    if (type === "yes") confidence += 20;
    if (type === "probably") confidence += 15;
    if (type === "probablynot") confidence += 8;
    if (type === "dk") confidence += 3;

    nextQuestion();
}

function nextQuestion() {
    if (confidence >= 80) {
        makeGuess();
        return;
    }

    currentQuestion++;

    if (currentQuestion < questions.length) {
        document.getElementById("question").textContent =
            questions[currentQuestion];
    } else {
        makeGuess();
    }
}

function makeGuess() {
    document.getElementById("answerButtons").style.display = "none";

    let guess = youtubers[Math.floor(Math.random() * youtubers.length)];

    document.getElementById("question").innerHTML =
        "🏴‍☠️ Arrr! Are you thinking of <b>" + guess + "</b>?<br><br>" +
        '<button class="yesBtn" onclick="correctGuess()">✅ Correct</button>' +
        '<button class="noBtn" onclick="wrongGuess()">❌ Wrong</button>' +
        '<button class="utilityBtn" onclick="restartGame()">🔄 Restart</button>';
}

function correctGuess() {
    document.getElementById("question").innerHTML =
        "🎉 I guessed correctly!<br><br>" +
        '<button onclick="restartGame()">Play Again</button>';
}

function wrongGuess() {
    document.getElementById("question").innerHTML =
        "🤔 Should I continue?<br><br>" +
        '<button class="yesBtn" onclick="continueGame()">Yes</button>' +
        '<button class="noBtn" onclick="showWinner()">No</button>';
}

function continueGame() {
    document.getElementById("answerButtons").style.display = "block";
    confidence = 0;

    if (skippedQuestions.length > 0) {
        document.getElementById("question").textContent =
            skippedQuestions.shift();
    } else {
        nextQuestion();
    }
}

function showWinner() {
    document.getElementById("gamePage").style.display = "none";
    document.getElementById("winnerPage").style.display = "flex";
}

function saveNewYoutuber() {
    let newName = document.getElementById("newYoutuber").value;

    if (newName !== "") {
        youtubers.push(newName);
        localStorage.setItem("captainClueYoutubers", JSON.stringify(youtubers));

        document.getElementById("winnerPage").innerHTML =
            "<div class='container'>" +
            "<h2>🏆 Thanks! New YouTuber saved!</h2>" +
            "<button onclick='restartGame()'>Play Again</button>" +
            "</div>";
    }
}

function goBack() {
    if (currentQuestion > 0) {
        currentQuestion--;
        document.getElementById("question").textContent =
            questions[currentQuestion];
    }
}

function skipQuestion() {
    skippedQuestions.push(questions[currentQuestion]);
    nextQuestion();
}

function restartGame() {
    location.reload();
}

window.onload = function () {
    let saved = localStorage.getItem("captainClueYoutubers");
    if (saved) {
        youtubers = JSON.parse(saved);
    }
};

</script>

</body>
</html>
