<!DOCTYPE html>

<head>
    <title>Captain Clue V2</title>

    <style>
        body {
            margin: 0;
            font-family: Calibri, sans-serif;
            background: #87CEEB;
            text-align: center;
        }

#homePage,
#gamePage,
#winnerPage {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

#gamePage,
#winnerPage {
    display: none;
}

.container {
    display: flex;
    flex-direction: column;
    align-items: center;
    max-width: 900px;
    width: 90%;
    padding: 20px;
}

/* FLOAT ANIMATION */
@keyframes floatPirate {
    0%, 100% {
        transform: translateY(0);
    }
    50% {
        transform: translateY(-10px);
    }
}

/* GAME PIRATE IMAGE */
.pirate-img {
    width: 160px;
    max-width: 40vw;
    height: auto;
    display: block;
    margin-bottom: 15px;
    animation: floatPirate 3s ease-in-out infinite;
}

/* HOME FLAG (emoji) */
.flag {
    font-size: 90px;
    animation: floatPirate 3s ease-in-out infinite;
}

/* QUESTION TEXT */
#question {
    font-size: 36px;
    font-weight: bold;
    margin-bottom: 25px;
    max-width: 900px;
}

/* BUTTON BASE */
.button {
    padding: 12px 24px;
    margin: 5px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-size: 18px;
}

/* ANSWER BUTTONS */
.yesBtn {
    background: limegreen;
    color: white;
}

.noBtn {
    background: red;
    color: white;
}

.dkBtn {
    background: gray;
    color: white;
}

.probBtn {
    background: gold;
}

.probNotBtn {
    background: orange;
}

/* UTILITY BUTTONS */
.utilityBtn {
    background: white;
}

/* INPUT BOX */
.input {
    padding: 10px;
    font-size: 18px;
    width: 300px;
}

    </style>
</head>

<!-- HOME PAGE -->

<div id="homePage">

    <div class="container">

        <div class="flag">🏴‍☠️</div>
 

    

        <h1>Captain Clue</h1>
    


        <p>
            Think of a YouTuber and I'll try to guess who it is!
        </p>

        <button onclick="startGame()">
            Start Game
        </button>

    </div>

</div>

<!-- GAME PAGE -->  

<div id="gamePage">

    <div class="container">

        <img src="pirate.png" class="pirate-img" alt="Captain Clue Pirate">

        <div id="question">
            Is your YouTuber known for gaming?
        </div>


<div id="answerButtons">

            <button class="yesBtn" onclick="answer('yes')">
                Yes
            </button>

            <button class="noBtn" onclick="answer('no')">
                No
            </button>

            <button class="dkBtn" onclick="answer('dk')">
                Don't Know
            </button>

            <button class="probBtn" onclick="answer('probably')">
                Probably
            </button>

            <button class="probNotBtn" onclick="answer('probablynot')">
                Probably Not
            </button>

        </div>

        <br>

        <div>

            <button class="utilityBtn" onclick="goBack()">
                ⬅️ Go Back
            </button>

            <button class="utilityBtn" onclick="skipQuestion()">
                ⏭️ Skip
            </button>

            <button class="utilityBtn" onclick="restartGame()">
                🔄 Restart
            </button>

        </div>

    </div>

</div>

    function continueGame(){

        document.getElementById("answerButtons").style.display = "block";

        confidence = 0;

            document.getElementById("question").textContent =

    }

        if(currentQuestion > 0){

    function skipQuestion(){


        skippedQuestions.push(
