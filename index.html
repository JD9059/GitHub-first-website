<!DOCTYPE html>
<html>

<head>
    <title>Captain Clue V2</title>

    <style>
        body {
            margin: 0;
            font-family: Calibri, sans-serif;
            background: #87CEEB;
            text-align: center;
        }

        /* 💬 FEEDBACK BUTTON */
        #feedbackBtn {
            position: fixed;
            top: 15px;
            right: 15px;
            padding: 10px 15px;
            font-size: 16px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background: white;
            z-index: 9999;
        }

        /* 🏴‍☠️ PIRATE IMAGE */
        .pirate-img {
            width: 150px;
            margin-top: 20px;
            animation: floatPirate 3s ease-in-out infinite;
        }

        /* FLOAT ANIMATION */
        @keyframes floatPirate {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        #homePage,
        #gamePage,
        #winnerPage {
            display: none;
            min-height: 100vh;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        #homePage {
            display: flex;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .flag {
            font-size: 80px;
        }

        #question {
            font-size: 30px;
            margin: 20px;
        }

        button {
            padding: 10px 15px;
            margin: 5px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }

        .yesBtn { background: limegreen; color: white; }
        .noBtn { background: red; color: white; }
        .dkBtn { background: gray; color: white; }
        .probBtn { background: gold; }
        .probNotBtn { background: orange; }
        .utilityBtn { background: white; }

        input {
            padding: 10px;
            font-size: 16px;
        }
    </style>
</head>

<body>

<!-- 💬 FEEDBACK BUTTON -->
<button id="feedbackBtn" onclick="openFeedback()">💬 Feedback</button>

<!-- 🏠 HOME PAGE -->
<div id="homePage">
    <div class="container">

        <div class="flag">🏴‍☠️</div>

        <h1>Captain Clue</h1>

        <!-- 🏴‍☠️ PIRATE IMAGE ADDED HERE -->
        <img src="pirate.png" class="pirate-img" alt="Captain Clue Pirate">

        <p>Think of a YouTuber and I will guess it!</p>

        <button onclick="startGame()">Start Game</button>

    </div>
</div>

<!-- 🎮 GAME PAGE -->
<div id="gamePage">
    <div class="container">

        <!-- 🏴‍☠️ PIRATE IMAGE ALSO ON GAME PAGE -->
        <img src="pirate.png" class="pirate-img" alt="Captain Clue Pirate">

        <div id="question">Loading...</div>

        <div>
            <button class="yesBtn" onclick="answer('yes')">Yes</button>
            <button class="noBtn" onclick="answer('no')">No</button>
            <button class="dkBtn" onclick="answer('dk')">Don't Know</button>
            <button class="probBtn" onclick="answer('probably')">Probably</button>
            <button class="probNotBtn" onclick="answer('probablynot')">Probably Not</button>
        </div>

        <div>
            <button class="utilityBtn" onclick="goBack()">⬅️ Go Back</button>
            <button class="utilityBtn" onclick="skipQuestion()">⏭️ Skip</button>
            <button class="utilityBtn" onclick="restartGame()">🔄 Restart</button>
        </div>

    </div>
</div>

<!-- 🏆 WINNER PAGE -->
<div id="winnerPage">

/* 🎮 GAME FUNCTIONS */

function startGame() {
    currentQuestion = 0;
    confidence = 0;

    document.getElementById("homePage").style.display = "none";
    document.getElementById("gamePage").style.display = "flex";

    document.getElementById("question").textContent =
        questions[currentQuestion];
}

function answer(type) {
    if (type === "yes") confidence += 20;
    if (type === "probably") confidence += 15;
    if (type === "probablynot") confidence += 8;
    if (type === "dk") confidence += 3;

    nextQuestion();
}

function nextQuestion() {
    currentQuestion++;

    if (confidence >= 80 || currentQuestion >= questions.length) {
        makeGuess();
        return;
    }

    document.getElementById("question").textContent =
        questions[currentQuestion];
}

function makeGuess() {
    let guess = youtubers[Math.floor(Math.random() * youtubers.length)];

    document.getElementById("question").innerHTML =
        "🏴‍☠️ Are you thinking of <b>" + guess + "</b>?<br><br>" +
        '<button class="yesBtn" onclick="restartGame()">Yes</button>' +
        '<button class="noBtn" onclick="restartGame()">No</button>';
}

/* 🔧 UTILITIES */

function goBack() {
    if (currentQuestion > 0) {
        currentQuestion--;
        document.getElementById("question").textContent =
            questions[currentQuestion];
    }
}

function skipQuestion() {
    currentQuestion++;
    nextQuestion();
}

function restartGame() {
    location.reload();
}

function saveNewYoutuber() {
    let name = document.getElementById("newYoutuber").value;

    if (name !== "") {
        youtubers.push(name);
        alert("Saved!");
        restartGame();
    }
}
